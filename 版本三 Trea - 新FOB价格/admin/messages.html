<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理 - 管理后台</title>
    <!-- Google tag (gtag.js) --> 
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9SR60CCYT"></script> 
    <script> 
      window.dataLayer = window.dataLayer || []; 
      function gtag(){dataLayer.push(arguments);} 
      gtag('js', new Date()); 
     
      gtag('config', 'G-S9SR60CCYT'); 
    </script>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin-styles.css">
    <style>
        /* 留言管理样式 */
        .messages-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .messages-table th,
        .messages-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .messages-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #333;
        }
        
        .messages-table tr:hover {
            background-color: #f5f5f5;
        }
        
        .message-actions {
            display: flex;
            gap: 10px;
        }
        
        .message-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.3s;
        }
        
        .view-message {
            color: #3498db;
        }
        
        .delete-message {
            color: #e74c3c;
        }
        
        .message-actions button:hover {
            opacity: 0.8;
        }
        
        .message-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-new {
            background-color: #e74c3c;
            color: white;
        }
        
        .status-read {
            background-color: #3498db;
            color: white;
        }
        
        .status-replied {
            background-color: #2ecc71;
            color: white;
        }
        
        /* 留言详情对话框样式 */
        .message-detail-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .message-detail-content {
            background-color: #fff;
            border-radius: 5px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .message-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }
        
        .message-detail-header h3 {
            margin: 0;
            color: #333;
        }
        
        .message-detail-body {
            padding: 20px;
        }
        
        .message-info-group {
            margin-bottom: 15px;
        }
        
        .message-info-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }
        
        .message-info-group p {
            margin: 0;
            color: #333;
            line-height: 1.5;
        }
        
        .message-content {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 5px;
            white-space: pre-wrap;
        }
        
        .message-detail-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        /* 回复表单样式 */
        .reply-form {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        .reply-form h4 {
            margin-top: 0;
            color: #333;
        }
        
        .reply-form textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 10px;
        }
        
        /* 筛选和搜索样式 */
        .messages-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .messages-filter {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .messages-filter select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
        }
        
        .messages-search {
            display: flex;
            align-items: center;
        }
        
        .messages-search input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
            width: 250px;
        }
        
        .messages-search button {
            padding: 8px 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        
        .messages-search button:hover {
            background-color: #2980b9;
        }
        
        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            gap: 5px;
        }
        
        .page-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background-color: #fff;
            color: #333;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .page-btn.active {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .page-btn:hover:not(.active):not([disabled]) {
            background-color: #f5f5f5;
        }
        
        .page-btn[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .messages-table th:nth-child(3),
            .messages-table td:nth-child(3) {
                display: none;
            }
            
            .messages-actions {
                flex-direction: column;
                align-items: stretch;
            }
            
            .messages-search input {
                width: 100%;
            }
        }
        
        @media (max-width: 576px) {
            .messages-table th:nth-child(4),
            .messages-table td:nth-child(4) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <div class="container">
            <div class="logo">
                <h1>管理后台</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">返回网站</a></li>
                    <li><a href="index.html">控制面板</a></li>
                    <li><a href="add-blog.html">添加博客</a></li>
                    <li><a href="media.html">媒体管理</a></li>
                    <li><a href="messages.html" class="active">留言管理</a></li>
                    <li><a href="settings.html">网站设置</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- 留言管理部分 -->
    <section class="messages-section">
        <div class="container">
            <div class="section-header">
                <h2>留言管理</h2>
                <p>查看和管理客户留言</p>
            </div>
            
            <div class="messages-actions">
                <div class="messages-filter">
                    <label for="statusFilter">状态筛选：</label>
                    <select id="statusFilter">
                        <option value="all">所有留言</option>
                        <option value="new">新留言</option>
                        <option value="read">已读</option>
                        <option value="replied">已回复</option>
                    </select>
                </div>
                <div class="messages-search">
                    <input type="text" id="messageSearch" placeholder="搜索留言...">
                    <button type="button"><i class="fas fa-search"></i></button>
                </div>
            </div>
            
            <!-- 留言表格 -->
            <div class="messages-table-container">
                <table class="messages-table">
                    <thead>
                        <tr>
                            <th>姓名</th>
                            <th>联系方式</th>
                            <th>邮箱</th>
                            <th>提交日期</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="messagesTableBody">
                        <!-- 留言数据将通过JavaScript动态加载 -->
                    </tbody>
                </table>
            </div>
            
            <!-- 分页控件 -->
            <div class="pagination">
                <button class="page-btn prev-btn" disabled><i class="fas fa-chevron-left"></i></button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn next-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </section>

    <!-- 留言详情对话框 -->
    <div class="message-detail-dialog" id="messageDetailDialog">
        <div class="message-detail-content">
            <div class="message-detail-header">
                <h3>留言详情</h3>
                <button class="close-btn" id="closeDetailDialog">&times;</button>
            </div>
            <div class="message-detail-body">
                <div class="message-info-group">
                    <label>姓名：</label>
                    <p id="detailName"></p>
                </div>
                <div class="message-info-group">
                    <label>联系方式：</label>
                    <p id="detailPhone"></p>
                </div>
                <div class="message-info-group">
                    <label>邮箱：</label>
                    <p id="detailEmail"></p>
                </div>
                <div class="message-info-group">
                    <label>收货地址：</label>
                    <p id="detailAddress"></p>
                </div>
                <div class="message-info-group">
                    <label>产品：</label>
                    <p id="detailProduct"></p>
                </div>
                <div class="message-info-group">
                    <label>数量：</label>
                    <p id="detailQuantity"></p>
                </div>
                <div class="message-info-group">
                    <label>留言内容：</label>
                    <div class="message-content" id="detailMessage"></div>
                </div>
                <div class="message-info-group">
                    <label>其他信息：</label>
                    <p id="detailOtherInfo"></p>
                </div>
                <div class="message-info-group">
                    <label>提交日期：</label>
                    <p id="detailDate"></p>
                </div>
                
                <!-- 回复表单 -->
                <div class="reply-form">
                    <h4>回复留言</h4>
                    <textarea id="replyContent" placeholder="输入回复内容..."></textarea>
                    <button class="btn-primary" id="sendReply">发送回复</button>
                </div>
            </div>
            <div class="message-detail-footer">
                <button class="btn-secondary" id="markAsRead">标记为已读</button>
                <button class="btn-outline btn-danger" id="deleteMessage">删除留言</button>
                <button class="btn-primary" id="closeDetail">关闭</button>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <h2>Head Lice Removal Expert</h2>
                    <p>管理后台</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023 Head Lice Removal Expert. 保留所有权利。</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="admin-script.js"></script>
    <script src="fix-messages.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 加载留言数据
            loadCustomerMessages();
            
            // 留言详情对话框功能
            const messageDetailDialog = document.getElementById('messageDetailDialog');
            const closeDetailDialog = document.getElementById('closeDetailDialog');
            const closeDetail = document.getElementById('closeDetail');
            
            closeDetailDialog.addEventListener('click', function() {
                messageDetailDialog.style.display = 'none';
            });
            
            closeDetail.addEventListener('click', function() {
                messageDetailDialog.style.display = 'none';
            });
            
            // 标记为已读按钮
            const markAsRead = document.getElementById('markAsRead');
            markAsRead.addEventListener('click', function() {
                const messageId = messageDetailDialog.dataset.messageId;
                if (messageId) {
                    markMessageAsRead(messageId);
                    alert('留言已标记为已读');
                }
            });
            
            // 删除留言按钮
            const deleteMessage = document.getElementById('deleteMessage');
            deleteMessage.addEventListener('click', function() {
                const messageId = messageDetailDialog.dataset.messageId;
                if (messageId && confirm('确定要删除这条留言吗？')) {
                    deleteCustomerMessage(messageId);
                    messageDetailDialog.style.display = 'none';
                }
            });
            
            // 发送回复按钮
            const sendReply = document.getElementById('sendReply');
            sendReply.addEventListener('click', function() {
                const messageId = messageDetailDialog.dataset.messageId;
                const replyContent = document.getElementById('replyContent').value.trim();
                
                if (!replyContent) {
                    alert('请输入回复内容');
                    return;
                }
                
                if (messageId) {
                    sendMessageReply(messageId, replyContent);
                    alert('回复已发送');
                    document.getElementById('replyContent').value = '';
                }
            });
            
            // 状态筛选功能
            const statusFilter = document.getElementById('statusFilter');
            statusFilter.addEventListener('change', function() {
                filterMessages(this.value);
            });
            
            // 搜索功能
            const messageSearch = document.getElementById('messageSearch');
            const searchButton = messageSearch.nextElementSibling;
            
            searchButton.addEventListener('click', function() {
                searchMessages(messageSearch.value.trim());
            });
            
            messageSearch.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchMessages(this.value.trim());
                }
            });
        });
        
        // 加载客户留言数据
        function loadCustomerMessages() {
            // 从localStorage获取留言数据
            const savedMessages = localStorage.getItem('customerMessages');
            const messagesTableBody = document.getElementById('messagesTableBody');
            
            if (!savedMessages) {
                messagesTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">暂无留言数据</td></tr>';
                return;
            }
            
            const messages = JSON.parse(savedMessages);
            
            // 清空表格
            messagesTableBody.innerHTML = '';
            
            // 添加留言数据到表格
            messages.forEach((message, index) => {
                const row = document.createElement('tr');
                
                // 格式化日期
                let submitDate = '未知日期';
                if (message.timestamp) {
                    const date = new Date(message.timestamp);
                    submitDate = date.toLocaleDateString('zh-CN', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
                
                // 设置状态样式
                let statusClass = 'status-new';
                let statusText = '新留言';
                
                if (message.status === 'read') {
                    statusClass = 'status-read';
                    statusText = '已读';
                } else if (message.status === 'replied') {
                    statusClass = 'status-replied';
                    statusText = '已回复';
                }
                
                row.innerHTML = `
                    <td>${message.name || '未提供'}</td>
                    <td>${message.phone || '未提供'}</td>
                    <td>${message.email || '未提供'}</td>
                    <td>${submitDate}</td>
                    <td><span class="message-status ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="message-actions">
                            <button class="view-message" data-id="${index}" title="查看详情"><i class="fas fa-eye"></i></button>
                            <button class="delete-message" data-id="${index}" title="删除"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                `;
                
                messagesTableBody.appendChild(row);
            });
            
            // 添加查看详情按钮事件
            const viewButtons = document.querySelectorAll('.view-message');
            viewButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const messageId = this.dataset.id;
                    showMessageDetail(messageId);
                });
            });
            
            // 添加删除按钮事件
            const deleteButtons = document.querySelectorAll('.delete-message');
            deleteButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const messageId = this.dataset.id;
                    if (confirm('确定要删除这条留言吗？')) {
                        deleteCustomerMessage(messageId);
                    }
                });
            });
        }
        
        // 显示留言详情
        function showMessageDetail(messageId) {
            const savedMessages = localStorage.getItem('customerMessages');
            if (!savedMessages) return;
            
            const messages = JSON.parse(savedMessages);
            const message = messages[messageId];
            
            if (!message) return;
            
            // 填充详情对话框
            document.getElementById('detailName').textContent = message.name || '未提供';
            document.getElementById('detailPhone').textContent = message.phone || '未提供';
            document.getElementById('detailEmail').textContent = message.email || '未提供';
            document.getElementById('detailAddress').textContent = message.address || '未提供';
            document.getElementById('detailProduct').textContent = message.product || '未提供';
            document.getElementById('detailQuantity').textContent = message.quantity || '1';
            document.getElementById('detailMessage').textContent = message.message || '无留言内容';
            
            // 其他信息
            let otherInfo = [];
            if (message.isDistributor) {
                otherInfo.push('有意成为分销商');
            }
            if (message.paymentMethod) {
                otherInfo.push(`支付方式: ${message.paymentMethod}`);
            }
            document.getElementById('detailOtherInfo').textContent = otherInfo.length > 0 ? otherInfo.join(', ') : '无';
            
            // 格式化日期
            let submitDate = '未知日期';
            if (message.timestamp) {
                const date = new Date(message.timestamp);
                submitDate = date.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            document.getElementById('detailDate').textContent = submitDate;
            
            // 设置当前消息ID
            const messageDetailDialog = document.getElementById('messageDetailDialog');
            messageDetailDialog.dataset.messageId = messageId;
            
            // 显示对话框
            messageDetailDialog.style.display = 'flex';
            
            // 如果是新留言，自动标记为已读
            if (!message.status || message.status === 'new') {
                markMessageAsRead(messageId);
            }
        }
        
        // 标记留言为已读
        function markMessageAsRead(messageId) {
            const savedMessages = localStorage.getItem('customerMessages');
            if (!savedMessages) return;
            
            const messages = JSON.parse(savedMessages);
            if (!messages[messageId]) return;
            
            // 更新状态
            if (messages[messageId].status !== 'replied') {
                messages[messageId].status = 'read';
            }
            
            // 保存回localStorage
            localStorage.setItem('customerMessages', JSON.stringify(messages));
            
            // 刷新留言列表
            loadCustomerMessages();
        }
        
        // 删除留言
        function deleteCustomerMessage(messageId) {
            const savedMessages = localStorage.getItem('customerMessages');
            if (!savedMessages) return;
            
            const messages = JSON.parse(savedMessages);
            if (!messages[messageId]) return;
            
            // 删除留言
            messages.splice(messageId, 1);
            
            // 保存回localStorage
            localStorage.setItem('customerMessages', JSON.stringify(messages));
            
            // 刷新留言列表
            loadCustomerMessages();
        }
        
        // 发送留言回复
        function sendMessageReply(messageId, replyContent) {
            const savedMessages = localStorage.getItem('customerMessages');
            if (!savedMessages) return;
            
            const messages = JSON.parse(savedMessages);
            if (!messages[messageId]) return;
            
            // 更新状态和回复内容
            messages[messageId].status = 'replied';
            messages[messageId].reply = replyContent;
            messages[messageId].replyDate = new Date().toISOString();
            
            // 保存回localStorage
            localStorage.setItem('customerMessages', JSON.stringify(messages));
            
            // 刷新留言列表
            loadCustomerMessages();
            
            // 这里可以添加实际发送邮件的代码
            console.log(`发送回复到 ${messages[messageId].email}：${replyContent}`);
        }
        
        // 筛选留言
        function filterMessages(status) {
            const rows = document.querySelectorAll('#messagesTableBody tr');
            
            if (status === 'all') {
                rows.forEach(row => {
                    row.style.display = '';
                });
                return;
            }
            
            rows.forEach(row => {
                const statusElement = row.querySelector('.message-status');
                if (statusElement) {
                    const rowStatus = statusElement.textContent === '新留言' ? 'new' : 
                                    statusElement.textContent === '已读' ? 'read' : 'replied';
                    
                    if (rowStatus === status) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                }
            });
        }
        
        // 搜索留言
        function searchMessages(query) {
            if (!query) {
                // 如果搜索框为空，显示所有留言
                const rows = document.querySelectorAll('#messagesTableBody tr');
                rows.forEach(row => {
                    row.style.display = '';
                });
                return;
            }
            
            query = query.toLowerCase();
            const rows = document.querySelectorAll('#messagesTableBody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                if (text.includes(query)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
