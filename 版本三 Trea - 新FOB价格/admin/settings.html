<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站设置 - 管理后台</title>
    <!-- Google tag (gtag.js) --> 
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9SR60CCYT"></script> 
    <script> 
      window.dataLayer = window.dataLayer || []; 
      function gtag(){dataLayer.push(arguments);} 
      gtag('js', new Date()); 
     
      gtag('config', 'G-S9SR60CCYT'); 
    </script>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <div class="container">
            <div class="logo">
                <h1>管理后台</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">返回网站</a></li>
                    <li><a href="index.html">控制面板</a></li>
                    <li><a href="add-blog.html">添加博客</a></li>
                    <li><a href="media.html">媒体管理</a></li>
                    <li><a href="settings.html" class="active">网站设置</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- 网站设置表单 -->
    <section class="settings-section">
        <div class="container">
            <div class="section-header">
                <h2>网站设置</h2>
                <p>配置您的网站基本信息和外观</p>
            </div>
            
            <div class="settings-form-container">
                <form id="settingsForm" class="settings-form">
                    <div class="form-tabs">
                        <button type="button" class="tab-btn active" data-tab="general">基本信息</button>
                        <button type="button" class="tab-btn" data-tab="seo">SEO设置</button>
                        <button type="button" class="tab-btn" data-tab="appearance">外观设置</button>
                        <button type="button" class="tab-btn" data-tab="contact">联系方式</button>
                    </div>
                    
                    <div class="tab-content active" id="general">
                        <div class="form-group">
                            <label for="siteName">网站名称</label>
                            <input type="text" id="siteName" name="siteName" placeholder="输入网站名称" value="Head Lice Removal Expert" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="siteTagline">网站标语</label>
                            <input type="text" id="siteTagline" name="siteTagline" placeholder="输入网站标语" value="Professional Anti-Lice Solution Provider">
                        </div>
                        
                        <div class="form-group">
                            <label for="siteLogo">网站Logo</label>
                            <input type="file" id="siteLogo" name="siteLogo" accept="image/*">
                            <div class="image-preview" id="logoPreview">
                                <p>当前未设置Logo</p>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="favicon">网站图标</label>
                            <input type="file" id="favicon" name="favicon" accept="image/*">
                            <div class="image-preview" id="faviconPreview">
                                <p>当前未设置图标</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="seo">
                        <div class="form-group">
                            <label for="metaTitle">默认Meta标题</label>
                            <input type="text" id="metaTitle" name="metaTitle" placeholder="输入默认Meta标题" value="Head Lice Removal Expert - Professional Anti-Lice Solution">
                        </div>
                        
                        <div class="form-group">
                            <label for="metaDescription">默认Meta描述</label>
                            <textarea id="metaDescription" name="metaDescription" placeholder="输入默认Meta描述" rows="3">专业的头虱去除解决方案，提供高效安全的电子头虱去除设备和专业指导。</textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="metaKeywords">默认Meta关键词</label>
                            <input type="text" id="metaKeywords" name="metaKeywords" placeholder="输入默认Meta关键词（逗号分隔）" value="头虱去除,头虱治疗,电子头虱机,头虱预防">
                        </div>
                        
                        <div class="form-group">
                            <label for="googleAnalytics">Google Analytics代码</label>
                            <textarea id="googleAnalytics" name="googleAnalytics" placeholder="输入Google Analytics跟踪代码" rows="3"></textarea>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="appearance">
                        <div class="form-group">
                            <label for="primaryColor">主色调</label>
                            <input type="color" id="primaryColor" name="primaryColor" value="#4CAF50">
                        </div>
                        
                        <div class="form-group">
                            <label for="secondaryColor">次要色调</label>
                            <input type="color" id="secondaryColor" name="secondaryColor" value="#2196F3">
                        </div>
                        
                        <div class="form-group">
                            <label for="fontFamily">字体选择</label>
                            <select id="fontFamily" name="fontFamily">
                                <option value="Arial, sans-serif">Arial</option>
                                <option value="'Helvetica Neue', Helvetica, sans-serif">Helvetica</option>
                                <option value="'Open Sans', sans-serif" selected>Open Sans</option>
                                <option value="'Roboto', sans-serif">Roboto</option>
                                <option value="'Lato', sans-serif">Lato</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="headerStyle">页眉样式</label>
                            <select id="headerStyle" name="headerStyle">
                                <option value="standard" selected>标准</option>
                                <option value="centered">居中</option>
                                <option value="minimal">简约</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="footerStyle">页脚样式</label>
                            <select id="footerStyle" name="footerStyle">
                                <option value="standard" selected>标准</option>
                                <option value="simple">简约</option>
                                <option value="detailed">详细</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="contact">
                        <div class="form-group">
                            <label for="contactEmail">联系邮箱</label>
                            <input type="email" id="contactEmail" name="contactEmail" placeholder="输入联系邮箱" value="contact@headliceremovalexpert.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="contactPhone">联系电话</label>
                            <input type="tel" id="contactPhone" name="contactPhone" placeholder="输入联系电话" value="+1 (800) 123-4567">
                        </div>
                        
                        <div class="form-group">
                            <label for="contactAddress">联系地址</label>
                            <textarea id="contactAddress" name="contactAddress" placeholder="输入联系地址" rows="3">123 Anti-Lice Street, Health City, HC 12345</textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>社交媒体链接</label>
                            <div class="social-inputs">
                                <div class="social-input">
                                    <i class="fab fa-facebook"></i>
                                    <input type="url" name="facebookUrl" placeholder="Facebook链接" value="https://facebook.com/headliceremovalexpert">
                                </div>
                                <div class="social-input">
                                    <i class="fab fa-twitter"></i>
                                    <input type="url" name="twitterUrl" placeholder="Twitter链接" value="https://twitter.com/liceremovalexp">
                                </div>
                                <div class="social-input">
                                    <i class="fab fa-instagram"></i>
                                    <input type="url" name="instagramUrl" placeholder="Instagram链接" value="https://instagram.com/headliceremoval">
                                </div>
                                <div class="social-input">
                                    <i class="fab fa-linkedin"></i>
                                    <input type="url" name="linkedinUrl" placeholder="LinkedIn链接" value="https://linkedin.com/company/headliceremoval">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">取消</button>
                        <button type="submit" class="btn-primary">保存设置</button>
                        <button type="button" class="btn-outline">恢复默认</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <h2>Head Lice Removal Expert</h2>
                    <p>管理后台</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023 Head Lice Removal Expert. 保留所有权利。</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="admin-script.js"></script>

</body>
</html>
