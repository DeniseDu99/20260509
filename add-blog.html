<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog Post - Admin Dashboard</title>
    <!-- Google tag (gtag.js) --> 
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S9SR60CCYT"></script> 
    <script> 
      window.dataLayer = window.dataLayer || []; 
      function gtag(){dataLayer.push(arguments);} 
      gtag('js', new Date()); 
     
      gtag('config', 'G-S9SR60CCYT'); 
    </script>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <div class="container">
            <div class="logo">
                <h1>Admin Dashboard</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">返回网站</a></li>
                    <li><a href="index.html">控制面板</a></li>
                    <li><a href="add-blog.html" class="active">添加博客</a></li>
                    <li><a href="media.html">媒体管理</a></li>
                    <li><a href="messages.html">留言管理</a></li>
                    <li><a href="settings.html">网站设置</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Add Blog Post Form -->
    <section class="add-blog-section">
        <div class="container">
            <div class="section-header">
                <h2>Add New Blog Post</h2>
                <p>Create a new blog post for your website</p>
            </div>
            
            <div class="blog-form-container">
                <form id="blogForm" class="blog-form">
                    <div class="form-group">
                        <label for="blogTitle">Blog Title</label>
                        <input type="text" id="blogTitle" name="blogTitle" placeholder="Enter blog title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="blogCategory">Category</label>
                        <select id="blogCategory" name="blogCategory" required>
                            <option value="">Select a category</option>
                            <option value="prevention">Prevention Guide</option>
                            <option value="treatment">Treatment Guide</option>
                            <option value="education">Educational</option>
                            <option value="research">Research & Studies</option>
                            <option value="product">Product Information</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="blogTags">Tags (comma separated)</label>
                        <input type="text" id="blogTags" name="blogTags" placeholder="e.g., Head Lice Prevention, School Health">
                    </div>
                    
                    <div class="form-group">
                        <label for="blogImage">Featured Image</label>
                        <input type="file" id="blogImage" name="blogImage" accept="image/*">
                        <div class="image-preview" id="imagePreview">
                            <p>No image selected</p>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="blogExcerpt">Blog Excerpt</label>
                        <textarea id="blogExcerpt" name="blogExcerpt" placeholder="Enter a short excerpt for the blog listing" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="blogContent">Blog Content</label>
                        <textarea id="blogContent" name="blogContent" placeholder="Enter the full blog content" rows="15" required></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Cancel</button>
                        <button type="submit" class="btn-primary">Publish Post</button>
                        <button type="button" class="btn-outline">Save as Draft</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <h2>Head Lice Removal Expert</h2>
                    <p>Admin Dashboard</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023 Head Lice Removal Expert. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script src="admin-script.js"></script>
    <script>
        // Image preview functionality
        document.getElementById('blogImage').addEventListener('change', function(event) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    preview.appendChild(img);
                }
                
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '<p>No image selected</p>';
            }
        });
        
        // Form submission handler
        document.getElementById('blogForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // In a real application, you would send this data to a server
            // For this demo, we'll just show an alert
            alert('Blog post published successfully!');
            
            // Redirect to dashboard
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
